<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name={iconName} size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small slds-truncate">{displayTitle}</span>
                    </h2>
                </div>
            </header>
            <div class="slds-no-flex header-actions">
                <template if:true={showNewButton}>
                    <lightning-button
                        label="New"
                        onclick={handleNewRecord}
                        class="slds-m-right_x-small"
                    ></lightning-button>
                </template>
                <template if:true={hasRecords}>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        variant="border-filled"
                        size="small"
                        onclick={handleRefresh}
                    ></lightning-button-icon>
                </template>
            </div>
        </div>
        <template if:true={hasRecords}>
            <p class="subtitle slds-text-body_small slds-text-color_weak">{subtitle}</p>
        </template>
        <div class="slds-card__body slds-is-relative">
            <template if:true={isLoading}>
                <div class="spinner-overlay">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-p-around_medium slds-text-color_error">
                    {errorMessage}
                </div>
            </template>

            <template if:true={hasRecords}>
                <lightning-datatable
                    key-field="Id"
                    data={records}
                    columns={columns}
                    hide-checkbox-column
                    show-row-number-column={showRowNumbers}
                    onrowaction={handleRowAction}
                    onsort={handleSort}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    default-sort-direction="asc"
                ></lightning-datatable>
            </template>
        </div>
        <template if:true={showViewAll}>
            <footer class="slds-card__footer">
                <a onclick={handleViewAll} class="slds-card__footer-action">View All</a>
            </footer>
        </template>
    </article>

    <template if:true={showModal}>
        <c-record-action-modal
            mode={modalMode}
            object-api-name={childObjectApiName}
            record-id={modalRecordId}
            object-label={cardTitle}
            field-names={modalFieldNames}
            default-field-values={modalDefaultFieldValues}
            onsuccess={handleModalSuccess}
            onclose={handleModalClose}
        ></c-record-action-modal>
    </template>
</template>
