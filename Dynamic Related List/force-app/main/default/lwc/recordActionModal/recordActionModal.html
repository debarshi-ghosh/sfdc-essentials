<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="modal-heading"
        class="slds-modal slds-fade-in-open slds-modal_small"
    >
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={handleCancel}
                >
                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="inverse"
                        size="small"
                    ></lightning-icon>
                </button>
                <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">{title}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium slds-is-relative">
                <template if:true={isSaving}>
                    <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                </template>

                <template if:true={hasError}>
                    <div class="slds-text-color_error slds-m-bottom_small" role="alert">{errorMessage}</div>
                </template>

                <template if:true={isDelete}>
                    <p>Are you sure you want to delete this record? This action cannot be undone.</p>
                </template>

                <template if:true={isForm}>
                    <lightning-record-edit-form
                        object-api-name={objectApiName}
                        record-id={formRecordId}
                        onsubmit={handleSubmit}
                        onsuccess={handleSuccess}
                        onerror={handleError}
                    >
                        <template for:each={fieldNames} for:item="field">
                            <lightning-input-field key={field} field-name={field}></lightning-input-field>
                        </template>
                        <div class="slds-m-top_medium slds-text-align_right">
                            <lightning-button
                                label="Cancel"
                                onclick={handleCancel}
                                class="slds-m-right_x-small"
                            ></lightning-button>
                            <lightning-button
                                variant="brand"
                                type="submit"
                                label="Save"
                                disabled={isSaving}
                            ></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>
            </div>

            <template if:true={isDelete}>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancel}
                        class="slds-m-right_x-small"
                    ></lightning-button>
                    <lightning-button
                        variant="destructive"
                        label="Delete"
                        onclick={handleDelete}
                        disabled={isSaving}
                    ></lightning-button>
                </footer>
            </template>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
