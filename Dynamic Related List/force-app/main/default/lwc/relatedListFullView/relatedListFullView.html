<template>
    <div class="full-view-container">
        <div class="page-header">
            <template if:true={showBreadcrumb}>
                <div class="breadcrumb-container">
                    <a class="breadcrumb-link" onclick={navigateToObjectHome}>{parentObjectLabel}</a>
                    <span class="breadcrumb-separator">&gt;</span>
                    <a class="breadcrumb-link" onclick={navigateToParent}>{parentName}</a>
                </div>
            </template>
            <div class="header-row">
                <div class="header-title-section">
                    <lightning-icon icon-name={iconName} size="medium" class="slds-m-right_small"></lightning-icon>
                    <h1 class="page-title">{cardTitle}</h1>
                </div>
                <div class="header-actions-section">
                    <template if:true={showNewButton}>
                        <lightning-button
                            label="New"
                            onclick={handleNewRecord}
                            class="slds-m-right_x-small"
                        ></lightning-button>
                    </template>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        variant="border-filled"
                        onclick={handleRefresh}
                    ></lightning-button-icon>
                </div>
            </div>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{subtitle}</p>
        </div>

        <div class="table-container slds-is-relative">
            <template if:true={isLoading}>
                <div class="spinner-overlay">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-p-around_medium slds-text-color_error">
                    {errorMessage}
                </div>
            </template>

            <template if:true={hasRecords}>
                <div class="pagination-container pagination-top">
                    <div class="pagination-left">
                        <span class="page-size-label">Rows per page:</span>
                        <lightning-combobox
                            value={pageSizeValue}
                            options={pageSizeOptions}
                            variant="label-hidden"
                            label="Rows per page"
                            class="page-size-select"
                            onchange={handlePageSizeChange}
                        ></lightning-combobox>
                    </div>
                    <div class="pagination-right">
                        <span class="page-info">{pageInfo}</span>
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            alternative-text="First Page"
                            variant="bare"
                            size="medium"
                            disabled={isFirstPage}
                            onclick={handleFirstPage}
                            class="pagination-btn"
                        ></lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:left"
                            alternative-text="Previous Page"
                            variant="bare"
                            size="medium"
                            disabled={isFirstPage}
                            onclick={handlePreviousPage}
                            class="pagination-btn"
                        ></lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:right"
                            alternative-text="Next Page"
                            variant="bare"
                            size="medium"
                            disabled={isLastPage}
                            onclick={handleNextPage}
                            class="pagination-btn"
                        ></lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            alternative-text="Last Page"
                            variant="bare"
                            size="medium"
                            disabled={isLastPage}
                            onclick={handleLastPage}
                            class="pagination-btn"
                        ></lightning-button-icon>
                    </div>
                </div>
                <lightning-datatable
                    key-field="Id"
                    data={paginatedRecords}
                    columns={columns}
                    hide-checkbox-column
                    show-row-number-column
                    onrowaction={handleRowAction}
                    onsort={handleSort}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    default-sort-direction="asc"
                ></lightning-datatable>
            </template>

            <template if:false={hasRecords}>
                <template if:false={isLoading}>
                    <template if:false={hasError}>
                        <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                            No records to display.
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </div>

    <template if:true={showModal}>
        <c-record-action-modal
            mode={modalMode}
            object-api-name={childObjectApiName}
            record-id={modalRecordId}
            object-label={cardTitle}
            field-names={modalFieldNames}
            default-field-values={modalDefaultFieldValues}
            onsuccess={handleModalSuccess}
            onclose={handleModalClose}
        ></c-record-action-modal>
    </template>
</template>
